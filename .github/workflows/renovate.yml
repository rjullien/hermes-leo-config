name: Renovate

on:
  schedule:
    # Toutes les 6h (00/06/12/18 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: "Niveau de log Renovate (debug pour diagnostic)"
        type: choice
        default: info
        options:
          - info
          - debug

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@39b914146caeff8cd512e61c8992f1d5913af85c # v46.2.5
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN }}
          # dry-run: true   # décommenter pour un essai sans ouvrir de PR
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: "optional"
          RENOVATE_REPOSITORIES: ${{ github.repository }}